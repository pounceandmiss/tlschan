[package]
name = "tlschan_rustls"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
default = ["webpki-roots-fallback"]
webpki-roots-fallback = ["dep:webpki-roots"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = { version = "1", optional = true }
ring = "0.17"
pkcs8 = { version = "0.10", default-features = false, features = ["encryption", "pem", "sha1-insecure", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
